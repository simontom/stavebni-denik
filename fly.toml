app = "stavebni-denik"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

# Secrets (set once, never commit):
#   fly secrets set JWT_SECRET=$(openssl rand -base64 32) \
#     JDBC_URL=jdbc:postgresql://<host>:5432/stavebni_denik DB_USER=... DB_PASSWORD=...
# The database must be PostgreSQL 18 (schema uses uuidv7()).
[env]
  APP_ENV = "production"
  UPLOADS_DIR = "/data/uploads"

# Photos must survive deploys: fly volumes create stavebni_denik_data --region fra
[mounts]
  source = "stavebni_denik_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    timeout = "5s"
