# Fly.io configuration for stavebni-denik.
#
# Single-tenant deploy: one web machine + one Postgres add-on + a
# persistent volume mounted at /data for photos / audit-verify log
# / PDF exports. Nightly maintenance (backup + audit chain verify)
# runs as standalone scheduled machines created out-of-band — see
# README "Backup & restore" and the audit-verify GitHub workflow.
#
# Full setup is in README "Production deployment (Fly.io)". TL;DR:
#   fly apps create stavebni-denik
#   fly volumes create stavebni_denik_data --size 10 --region fra
#   fly postgres create --name stavebni-denik-db --region fra
#   fly postgres attach stavebni-denik-db
#   fly secrets set \
#     AUTH_SECRET="$(openssl rand -base64 32)" \
#     AUTH_URL="https://stavebni-denik.fly.dev"
#   fly deploy

app = "stavebni-denik"
primary_region = "fra"           # Frankfurt — closest EU region to CZ users.
kill_signal = "SIGTERM"
kill_timeout = "30s"
# Memory headroom on the 1 GB shared-cpu-1x VM: sharp (photo
# upload) and Chromium (PDF export) both spike RAM well past 1 GB
# on bigger jobs and would otherwise trip Fly's OOM killer. The
# swapfile lives on the persistent volume (/data) so it survives
# restarts without competing with the rootfs for space.
swap_size_mb = 512

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  DATA_DIR = "/data"
  TZ = "Europe/Prague"
  OPEN_METEO_BASE = "https://api.open-meteo.com/v1"
  NEXT_PUBLIC_APP_NAME = "Stavební deník"
  # AUTH_URL gets injected via secrets so a custom domain swap
  # doesn't require an image rebuild.

# Pre-traffic, post-build migration step. Fly spins up one ephemeral
# machine, runs the command against the production DB, then proceeds
# with the rolling deploy ONLY if it exits 0 — so a broken migration
# never reaches users. The web `CMD` in Dockerfile keeps its own
# `prisma migrate deploy` as a safety net for older machines that
# boot before this release command runs (idempotent).
[deploy]
  release_command = "node_modules/.bin/prisma migrate deploy"
  strategy = "rolling"

# Persistent volume for photos, PDF exports and the audit-verify log.
# `auto_extend_size_threshold` / `_increment_gb` keep us from filling up.
[mounts]
  source = "stavebni_denik_data"
  destination = "/data"
  initial_size = "10gb"
  auto_extend_size_threshold = 80
  auto_extend_size_increment = "5gb"
  auto_extend_size_limit = "50gb"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  # Single-tenant: at most one running machine.
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/healthz"

# Minimum viable VM for a small construction firm; bump to shared-cpu-2x or
# performance-1x once daily report volume + PDF exports stress it.
[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
  cpus = 1

# ---------------------------------------------------------------------------
# Logging / metrics
# ---------------------------------------------------------------------------
# stdout/stderr is forwarded by Fly's log shipper without extra config.
# A Prometheus `/metrics` endpoint isn't exposed yet — when we add one,
# uncomment the [metrics] section below and point it at the right path.
#
# [metrics]
#   port = 9091
#   path = "/metrics"
