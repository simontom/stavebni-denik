name: Audit verify

# Daily tamper-evidence check of the audit_log hash chain, with the Kotlin application's own command:
#
#   java -cp backend-all.jar cz.stavebni.denik.cli.AdminCliKt audit-verify
#
# It only reads (no migration, no write), so a read-only database role is enough. Exit codes:
#   0 chain intact   1 chain BROKEN   3 the check could not run (database unreachable, schema missing, ...)
# Anything but 0 fails this job, and GitHub then notifies the maintainers.
#
# THIS WORKFLOW FAILS WHEN IT IS NOT CONFIGURED. A nightly check that goes green without having checked anything is
# worse than none: nobody notices that nothing is watching the log. Until a production database exists, disable the
# workflow in the Actions tab (it can be re-enabled there), or set the secrets below.
#
# Repository secrets (Settings -> Secrets and variables -> Actions):
#   AUDIT_JDBC_URL       e.g. jdbc:postgresql://<host>:5432/stavebni_denik?sslmode=require  (must be reachable from GitHub)
#   AUDIT_DB_USER        a role that can SELECT from audit_log
#   AUDIT_DB_PASSWORD
# Optional repository variable:
#   AUDIT_ANCHOR         "<id>:<hash>" printed by `audit-head`; when set, the check also proves the log was not cut
#                        back below that row.

on:
  schedule:
    # Every day at 04:00 UTC.
    - cron: "0 4 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: audit-verify-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify audit-log hash chain
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      JDBC_URL: ${{ secrets.AUDIT_JDBC_URL }}
      DB_USER: ${{ secrets.AUDIT_DB_USER }}
      DB_PASSWORD: ${{ secrets.AUDIT_DB_PASSWORD }}
      AUDIT_ANCHOR: ${{ vars.AUDIT_ANCHOR }}

    steps:
      - name: Check that the database is configured
        run: |
          missing=""
          [ -n "${JDBC_URL}" ] || missing="$missing AUDIT_JDBC_URL"
          [ -n "${DB_USER}" ] || missing="$missing AUDIT_DB_USER"
          [ -n "${DB_PASSWORD}" ] || missing="$missing AUDIT_DB_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error title=Audit log is not being verified::Missing repository secrets:$missing. Set them, or disable this workflow until a production database exists."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Build the application jar
        run: |
          chmod +x gradlew
          ./gradlew :backend:shadowJar -x test --console=plain

      - name: Verify the audit-log hash chain
        run: |
          set +e
          if [ -n "${AUDIT_ANCHOR}" ]; then
            java -cp backend/build/libs/*-all.jar cz.stavebni.denik.cli.AdminCliKt audit-verify "${AUDIT_ANCHOR}"
          else
            java -cp backend/build/libs/*-all.jar cz.stavebni.denik.cli.AdminCliKt audit-verify
          fi
          code=$?
          case "$code" in
            0) echo "Audit log intact." ;;
            1) echo "::error title=AUDIT LOG BROKEN::The hash chain does not verify (or the log was cut below the anchor). Treat this as a security incident: do not write to the database, and see the output above." ;;
            3) echo "::error title=Audit log could not be checked::The check did not run (see the output above). Nothing was verified." ;;
            *) echo "::error title=Audit check failed unexpectedly::exit code $code" ;;
          esac
          exit "$code"
