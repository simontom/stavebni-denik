name: Audit verify

# Daily tamper-evidence check of the audit_log hash chain.
#
# Walks the whole chain via `scripts/verify-audit.ts`. The script exits:
#   0 — chain intact, 1 — chain broken, 2 — unexpected error.
# A non-zero exit fails this job (so GitHub notifies the maintainers) and,
# when SMTP_* / ALERT_EMAIL secrets are configured, the script also e-mails
# the BOSS directly. Can be triggered manually via "Run workflow".
#
# Required repository secret (when missing, the workflow runs but
# every meaningful step is skipped via a guard — see steps below):
#   AUDIT_DATABASE_URL  — connection string to the production database
#                         (a read-only role is sufficient).
# Optional secrets for the e-mail alert (otherwise the alert is skipped):
#   SMTP_HOST, SMTP_PORT, SMTP_SECURE, SMTP_USER, SMTP_PASS, SMTP_FROM,
#   ALERT_EMAIL

on:
  schedule:
    # Every day at 04:00 UTC.
    - cron: "0 4 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: audit-verify-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify audit-log hash chain
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.AUDIT_DATABASE_URL }}
      NEXT_PUBLIC_APP_NAME: Stavební deník
      TZ: Europe/Prague
      NEXT_TELEMETRY_DISABLED: "1"
      # E-mail alert configuration (read by scripts/verify-audit.ts via the
      # SMTP helper). Missing values simply disable the e-mail.
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_SECURE: ${{ secrets.SMTP_SECURE }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      SMTP_FROM: ${{ secrets.SMTP_FROM }}
      ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}

    steps:
      # GitHub Actions disallows `secrets.X` in job-level `if:`, so we
      # gate at step level via this guard that reads the env var the
      # secret was projected into.
      - name: Check AUDIT_DATABASE_URL
        id: guard
        run: |
          if [ -z "${DATABASE_URL}" ]; then
            echo "::notice::AUDIT_DATABASE_URL secret is not configured — skipping nightly audit chain verification. Set the secret in repo Settings → Secrets → Actions to enable it."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.guard.outputs.configured == 'true'
        uses: actions/checkout@v7

      - name: Setup pnpm
        if: steps.guard.outputs.configured == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
          run_install: false

      - name: Setup Node.js
        if: steps.guard.outputs.configured == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        if: steps.guard.outputs.configured == 'true'
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        if: steps.guard.outputs.configured == 'true'
        run: pnpm exec prisma generate

      - name: Verify audit-log hash chain
        if: steps.guard.outputs.configured == 'true'
        # Call tsx directly (the `verify:audit` package script reads a local
        # .env which does not exist in CI — here the env comes from secrets).
        run: pnpm exec tsx scripts/verify-audit.ts
