name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint_build:
    name: Lint + typecheck + build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: stavebni_denik
          POSTGRES_USER: denik
          POSTGRES_PASSWORD: denik_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U denik -d stavebni_denik"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        run: npm install -g pnpm

      - name: Backend assemble & compile
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew assemble --console=plain 2>&1 | tee /tmp/gradle.log

      - name: Frontend install, lint & build
        run: |
          set -o pipefail
          cd frontend
          { pnpm install && pnpm lint && pnpm build; } 2>&1 | tee /tmp/frontend.log

      - name: Failure summary
        if: failure()
        run: |
          {
            echo "## lint_build failure"
            for f in /tmp/gradle.log /tmp/frontend.log; do
              [ -f "$f" ] || continue
              echo "### $f (errors)"; echo '```'
              grep -nE "^e: |error|FAILED|What went wrong" "$f" | head -80 || true
              echo '```'
              echo "### $f (tail)"; echo '```'; tail -n 60 "$f"; echo '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"

  integration:
    name: Integration tests (Testcontainers Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: stavebni_denik
          POSTGRES_USER: denik
          POSTGRES_PASSWORD: denik_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U denik -d stavebni_denik"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Run Backend Integration Tests
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew test --console=plain 2>&1 | tee /tmp/gradle-test.log

      - name: Failure summary
        if: failure()
        run: |
          {
            echo "## integration failure"
            echo '```'
            grep -nE "^e: |FAILED|What went wrong|Exception|expected:" /tmp/gradle-test.log | head -120 || true
            echo '```'
            echo "### tail"; echo '```'; tail -n 80 /tmp/gradle-test.log; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  e2e:
    name: E2E tests (Playwright + Postgres service)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [lint_build]

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: stavebni_denik
          POSTGRES_USER: denik
          POSTGRES_PASSWORD: denik_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U denik -d stavebni_denik"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        run: npm install -g pnpm

      - name: Install root dependencies
        run: pnpm install --frozen-lockfile

      - name: Install frontend dependencies
        run: |
          cd frontend
          pnpm install

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Pre-build Backend
        run: |
          chmod +x gradlew
          ./gradlew assemble

      - name: Start Ktor Backend
        timeout-minutes: 4
        run: |
          ./gradlew :backend:run --console=plain > /tmp/backend.log 2>&1 &
          for i in {1..120}; do
            if curl -fsS --max-time 2 http://localhost:8080/api/health 2>/dev/null | grep -q "ok"; then
              echo "Backend is ready after ${i}s"
              break
            fi
            sleep 1
          done
          if ! curl -fsS --max-time 2 http://localhost:8080/api/health > /dev/null 2>&1; then
            echo "=== Backend failed to start. Logs: ==="
            cat /tmp/backend.log
            exit 1
          fi

      - name: Run Playwright E2E Tests
        timeout-minutes: 12
        run: |
          set -o pipefail
          pnpm exec playwright test 2>&1 | tee /tmp/playwright.log

      - name: E2E summary
        if: ${{ !cancelled() }}
        run: |
          {
            echo "## Playwright"
            echo '```'
            grep -nE "✘|✓|passed|failed|flaky|Error:|Timeout|expect\(|at .*spec\.ts" /tmp/playwright.log | head -150 || true
            echo '```'
            echo "### Playwright tail"; echo '```'; tail -n 60 /tmp/playwright.log 2>/dev/null; echo '```'
            echo "## Backend log (errors)"
            echo '```'
            grep -nE "ERROR|WARN|Exception|Caused by" /tmp/backend.log | head -80 || true
            echo '```'
            echo "### Backend log tail"; echo '```'; tail -n 60 /tmp/backend.log 2>/dev/null; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
            /tmp/backend.log
            /tmp/playwright.log
          retention-days: 14
