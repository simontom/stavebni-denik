name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Pinned so installs are reproducible (frontend/ is its own pnpm workspace).
  PNPM_VERSION: 12.8.1

jobs:
  lint_build:
    name: Lint + typecheck + build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Setup pnpm
        run: npm install -g pnpm@${{ env.PNPM_VERSION }}

      # Until backend/src/generated/jooq is committed, generate it here
      # (Testcontainers postgres:18-alpine; Docker is available on the runner).
      - name: Ensure jOOQ sources
        run: |
          chmod +x gradlew
          if [ -z "$(git ls-files backend/src/generated/jooq)" ]; then
            ./gradlew :backend:generateJooq --console=plain
          fi

      - name: Backend assemble & compile
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew assemble --console=plain 2>&1 | tee /tmp/gradle.log

      - name: Frontend install, lint & build
        run: |
          set -o pipefail
          cd frontend
          # --frozen-lockfile once frontend/pnpm-lock.yaml is committed
          if [ -f pnpm-lock.yaml ]; then INSTALL="pnpm install --frozen-lockfile"; else INSTALL="pnpm install"; fi
          { $INSTALL && pnpm lint && pnpm build; } 2>&1 | tee /tmp/frontend.log

      - name: Failure summary
        if: failure()
        run: |
          {
            echo "## lint_build failure"
            for f in /tmp/gradle.log /tmp/frontend.log; do
              [ -f "$f" ] || continue
              echo "### $f (errors)"; echo '```'
              grep -nE "^e: |error|FAILED|What went wrong" "$f" | head -80 || true
              echo '```'
              echo "### $f (tail)"; echo '```'; tail -n 60 "$f"; echo '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"

  integration:
    name: Integration tests (Testcontainers Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      # Until backend/src/generated/jooq is committed, generate it here
      # (Testcontainers postgres:18-alpine; Docker is available on the runner).
      - name: Ensure jOOQ sources
        run: |
          chmod +x gradlew
          if [ -z "$(git ls-files backend/src/generated/jooq)" ]; then
            ./gradlew :backend:generateJooq --console=plain
          fi

      # Tests start their own postgres:18-alpine via Testcontainers.
      - name: Run Backend Integration Tests
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew test --console=plain 2>&1 | tee /tmp/gradle-test.log

      - name: Failure summary
        if: failure()
        run: |
          {
            echo "## integration failure"
            echo '```'
            grep -nE "^e: |FAILED|What went wrong|Exception|expected:" /tmp/gradle-test.log | head -120 || true
            echo '```'
            echo "### tail"; echo '```'; tail -n 80 /tmp/gradle-test.log; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  jooq:
    name: jOOQ codegen drift check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Regenerate jOOQ sources (Testcontainers postgres:18-alpine)
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew :backend:generateJooq --console=plain 2>&1 | tee /tmp/jooq.log

      - name: Fail on drift
        run: |
          if [ -z "$(git ls-files backend/src/generated/jooq)" ]; then
            echo "::warning::backend/src/generated/jooq is not committed yet. Run './gradlew :backend:generateJooq' locally and commit it; until then CI generates the sources on the fly."
            exit 0
          fi
          git add -N backend/src/generated/jooq
          if ! git diff --quiet -- backend/src/generated/jooq; then
            git diff --stat -- backend/src/generated/jooq | tail -n 40
            echo "::error::Generated jOOQ sources are out of date. Run './gradlew :backend:generateJooq' and commit backend/src/generated/jooq."
            exit 1
          fi

      - name: Upload generated jOOQ sources
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: jooq-generated-sources
          path: backend/src/generated/jooq/
          retention-days: 14

      - name: Failure summary
        if: failure()
        run: |
          {
            echo "## jOOQ codegen failure"
            echo '```'
            grep -nE "ERROR|Exception|What went wrong|Caused by" /tmp/jooq.log | head -60 || true
            echo '```'
            echo "### tail"; echo '```'; tail -n 60 /tmp/jooq.log; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  e2e:
    name: E2E tests (Playwright + Postgres service)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [lint_build]

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: stavebni_denik
          POSTGRES_USER: denik
          POSTGRES_PASSWORD: denik_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U denik -d stavebni_denik"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Setup pnpm
        run: npm install -g pnpm@${{ env.PNPM_VERSION }}

      - name: Install root dependencies
        run: pnpm install --frozen-lockfile

      - name: Install frontend dependencies
        run: |
          cd frontend
          if [ -f pnpm-lock.yaml ]; then pnpm install --frozen-lockfile; else pnpm install; fi

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      # Until backend/src/generated/jooq is committed, generate it here
      # (Testcontainers postgres:18-alpine; Docker is available on the runner).
      - name: Ensure jOOQ sources
        run: |
          chmod +x gradlew
          if [ -z "$(git ls-files backend/src/generated/jooq)" ]; then
            ./gradlew :backend:generateJooq --console=plain
          fi

      - name: Pre-build Backend
        run: |
          ./gradlew assemble --console=plain

      - name: Start Ktor Backend
        timeout-minutes: 4
        run: |
          ./gradlew :backend:run --console=plain > /tmp/backend.log 2>&1 &
          for i in {1..120}; do
            if curl -fsS --max-time 2 http://localhost:8080/api/health 2>/dev/null | grep -q "ok"; then
              echo "Backend is ready after ${i}s"
              break
            fi
            sleep 1
          done
          if ! curl -fsS --max-time 2 http://localhost:8080/api/health > /dev/null 2>&1; then
            echo "=== Backend failed to start. Logs: ==="
            cat /tmp/backend.log
            exit 1
          fi

      - name: Run Playwright E2E Tests
        timeout-minutes: 12
        run: |
          set -o pipefail
          pnpm exec playwright test 2>&1 | tee /tmp/playwright.log

      - name: E2E summary
        if: ${{ !cancelled() }}
        run: |
          {
            echo "## Playwright"
            echo '```'
            grep -nE "✘|✓|passed|failed|flaky|Error:|Timeout|expect\(|at .*spec\.ts" /tmp/playwright.log | head -150 || true
            echo '```'
            echo "### Playwright tail"; echo '```'; tail -n 60 /tmp/playwright.log 2>/dev/null; echo '```'
            echo "## Backend log (errors)"
            echo '```'
            grep -nE "ERROR|WARN|Exception|Caused by" /tmp/backend.log | head -80 || true
            echo '```'
            echo "### Backend log tail"; echo '```'; tail -n 60 /tmp/backend.log 2>/dev/null; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
            /tmp/backend.log
            /tmp/playwright.log
          retention-days: 14

  docker:
    name: Docker image build (Fly)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      # Until backend/src/generated/jooq is committed, generate it here
      # (Testcontainers postgres:18-alpine; Docker is available on the runner).
      - name: Ensure jOOQ sources
        run: |
          chmod +x gradlew
          if [ -z "$(git ls-files backend/src/generated/jooq)" ]; then
            ./gradlew :backend:generateJooq --console=plain
          fi

      - name: Build image (no push)
        run: |
          set -o pipefail
          docker build --progress=plain -t stavebni-denik:ci . 2>&1 | tee /tmp/docker.log

      - name: Smoke test image contents
        run: |
          docker run --rm --entrypoint typst stavebni-denik:ci --version
          docker run --rm --entrypoint sh stavebni-denik:ci -c 'test -f /app/app.jar && test -f /app/static/index.html && echo "jar + SPA present"'

      - name: Failure summary
        if: failure()
        run: |
          {
            echo "## docker build failure"
            echo '```'
            grep -nE "ERROR|error:|failed" /tmp/docker.log | head -60 || true
            echo '```'
            echo "### tail"; echo '```'; tail -n 60 /tmp/docker.log; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
