name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: stavebni_denik
          POSTGRES_USER: denik
          POSTGRES_PASSWORD: denik_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Test & Build Backend
      run: |
        chmod +x gradlew
        ./gradlew test build

    - name: Build & Lint Frontend
      run: |
        cd frontend
        npm install -g pnpm
        pnpm install
        pnpm lint
        pnpm build
