name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint_build:
    name: Lint + typecheck + build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: stavebni_denik
          POSTGRES_USER: denik
          POSTGRES_PASSWORD: denik_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U denik -d stavebni_denik"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        run: npm install -g pnpm

      - name: Backend assemble & compile
        run: |
          chmod +x gradlew
          ./gradlew assemble

      - name: Frontend install, lint & build
        run: |
          cd frontend
          pnpm install
          pnpm lint
          pnpm build

  integration:
    name: Integration tests (Testcontainers Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: stavebni_denik
          POSTGRES_USER: denik
          POSTGRES_PASSWORD: denik_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U denik -d stavebni_denik"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Run Backend Integration Tests
        run: |
          chmod +x gradlew
          ./gradlew test

  e2e:
    name: E2E tests (Playwright + Postgres service)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [lint_build]

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: stavebni_denik
          POSTGRES_USER: denik
          POSTGRES_PASSWORD: denik_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U denik -d stavebni_denik"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        run: npm install -g pnpm

      - name: Install root dependencies
        run: pnpm install --frozen-lockfile

      - name: Install frontend dependencies
        run: |
          cd frontend
          pnpm install

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Pre-build Backend
        run: |
          chmod +x gradlew
          ./gradlew assemble

      - name: Start Ktor Backend
        run: |
          ./gradlew :backend:run > /tmp/backend.log 2>&1 &
          for i in {1..90}; do
            if curl -s http://localhost:8080/api/health | grep -q "ok"; then
              echo "Backend is ready"
              break
            fi
            sleep 1
          done
          if ! curl -fsS http://localhost:8080/api/health > /dev/null 2>&1; then
            echo "=== Backend failed to start. Logs: ==="
            cat /tmp/backend.log
            exit 1
          fi

      - name: Run Playwright E2E Tests
        run: pnpm exec playwright test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test-results/
          retention-days: 14
