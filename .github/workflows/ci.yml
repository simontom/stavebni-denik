name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Pinned so installs are reproducible (frontend/ is its own pnpm workspace).
  PNPM_VERSION: 12.8.1

jobs:
  lint_build:
    name: Lint + typecheck + build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Setup pnpm
        run: npm install -g pnpm@${{ env.PNPM_VERSION }}

      - name: Backend assemble & compile
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew assemble --console=plain 2>&1 | tee /tmp/gradle.log

      - name: Frontend install, lint & build
        run: |
          set -o pipefail
          cd frontend
          # The committed lockfile is the source of truth: a package.json that disagrees with it fails here.
          { pnpm install --frozen-lockfile && pnpm lint && pnpm build; } 2>&1 | tee /tmp/frontend.log

      - name: Failure summary
        if: failure()
        run: |
          {
            echo "## lint_build failure"
            for f in /tmp/gradle.log /tmp/frontend.log; do
              [ -f "$f" ] || continue
              echo "### $f (errors)"; echo '```'
              grep -nE "^e: |error|FAILED|What went wrong" "$f" | head -80 || true
              echo '```'
              echo "### $f (tail)"; echo '```'; tail -n 60 "$f"; echo '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"

  integration:
    name: Integration tests (Testcontainers Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Route Docker Hub pulls through a mirror
        uses: ./.github/actions/docker-mirror

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      # typst renders the PDF exports. RealTypstPdfTest runs the real tool; REQUIRE_TYPST=1 below
      # makes a missing typst a failure instead of a skip.
      - name: Install typst (pinned)
        uses: ./.github/actions/install-typst

      # Tests start their own postgres:18-alpine via Testcontainers.
      - name: Run Backend Integration Tests
        env:
          REQUIRE_TYPST: "1"
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew test --console=plain 2>&1 | tee /tmp/gradle-test.log

      - name: Failure summary
        if: failure()
        run: |
          {
            echo "## integration failure"
            echo '```'
            grep -nE "^e: |FAILED|What went wrong|Exception|expected:" /tmp/gradle-test.log | head -120 || true
            echo '```'
            echo "### tail"; echo '```'; tail -n 80 /tmp/gradle-test.log; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  jooq:
    name: jOOQ codegen drift check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Route Docker Hub pulls through a mirror
        uses: ./.github/actions/docker-mirror

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Regenerate jOOQ sources (Testcontainers postgres:18-alpine)
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew :backend:generateJooq --console=plain 2>&1 | tee /tmp/jooq.log

      - name: Fail on drift
        run: |
          # status --porcelain also reports added (untracked) and deleted files,
          # which a plain `git diff` would miss.
          if [ -n "$(git status --porcelain -- backend/src/generated/jooq)" ]; then
            git status --short -- backend/src/generated/jooq | head -n 40
            echo "::error::Generated jOOQ sources are out of date. Run './gradlew :backend:generateJooq' and commit backend/src/generated/jooq."
            exit 1
          fi

      - name: Upload generated jOOQ sources
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: jooq-generated-sources
          path: backend/src/generated/jooq/
          retention-days: 14

      - name: Failure summary
        if: failure()
        run: |
          {
            echo "## jOOQ codegen failure"
            echo '```'
            grep -nE "ERROR|Exception|What went wrong|Caused by" /tmp/jooq.log | head -60 || true
            echo '```'
            echo "### tail"; echo '```'; tail -n 60 /tmp/jooq.log; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  e2e:
    name: E2E tests (Playwright + Postgres service)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [lint_build]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Route Docker Hub pulls through a mirror
        uses: ./.github/actions/docker-mirror

      # A step, not a service container: service containers are pulled before the first step runs, so the mirror above
      # could not help them.
      - name: Start PostgreSQL 18
        run: |
          docker run -d --name e2e-postgres -p 5432:5432 \
            -e POSTGRES_DB=stavebni_denik -e POSTGRES_USER=denik -e POSTGRES_PASSWORD=denik_dev \
            postgres:18-alpine >/dev/null
          # Over TCP: while the image initialises, a temporary server answers on the socket only (see the Docker job).
          for i in $(seq 1 60); do
            docker exec e2e-postgres pg_isready -h 127.0.0.1 -U denik -d stavebni_denik >/dev/null 2>&1 && break
            sleep 1
          done
          docker exec e2e-postgres pg_isready -h 127.0.0.1 -U denik -d stavebni_denik

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Setup pnpm
        run: npm install -g pnpm@${{ env.PNPM_VERSION }}

      - name: Install root dependencies
        run: pnpm install --frozen-lockfile

      - name: Install frontend dependencies
        run: |
          cd frontend
          pnpm install --frozen-lockfile

      - name: Type-check the E2E code
        run: pnpm typecheck

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      # The seed resets known admin accounts and deletes users; it must refuse
      # every non-local database.
      - name: Seed safety guard tests
        run: pnpm exec tsx --test scripts/dev/local-db-guard.test.ts

      # The E2E flow downloads a real PDF, so the backend needs typst on its PATH.
      - name: Install typst (pinned)
        uses: ./.github/actions/install-typst

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Pre-build Backend
        run: |
          set -o pipefail
          ./gradlew assemble --console=plain 2>&1 | tee /tmp/gradle-assemble.log

      - name: Start Ktor Backend
        timeout-minutes: 4
        run: |
          ./gradlew :backend:run --console=plain > /tmp/backend.log 2>&1 &
          for i in {1..120}; do
            if curl -fsS --max-time 2 http://localhost:8080/api/health 2>/dev/null | grep -q "ok"; then
              echo "Backend is ready after ${i}s"
              break
            fi
            sleep 1
          done
          if ! curl -fsS --max-time 2 http://localhost:8080/api/health > /dev/null 2>&1; then
            echo "=== Backend failed to start. Logs: ==="
            cat /tmp/backend.log
            exit 1
          fi

      - name: Run Playwright E2E Tests
        timeout-minutes: 12
        run: |
          set -o pipefail
          pnpm exec playwright test 2>&1 | tee /tmp/playwright.log

      # Backs up the database and photos the tests just created (real signed entries, addenda, acknowledgements), restores
      # them into an empty database and verifies the result (photo hashes, audit chain against the anchor, signatures),
      # then shows that the restore refuses a non-empty target, a damaged backup and a replaced photo.
      - name: Backup and restore drill
        timeout-minutes: 5
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: denik
          PGPASSWORD: denik_dev
          PGDATABASE: stavebni_denik
          PG_DOCKER_IMAGE: postgres:18-alpine
          UPLOADS_DIR: backend/uploads
          DRILL_DIR: ${{ runner.temp }}/restore-drill
        run: |
          set -o pipefail
          ./gradlew :backend:shadowJar -q --console=plain
          APP_JAR="$PWD/backend/build/libs/backend-all.jar" bash scripts/backup/drill.sh 2>&1 | tee /tmp/restore-drill.log

      # The audit anchor (decision D4): records the head of the audit log outside the database with an RFC 3161 token, against a
      # throwaway time-stamping authority, and shows that it refuses an unreachable authority, an edited earlier record, a log
      # that lacks the row an earlier record named, and a certificate that is not the pinned one.
      - name: Audit anchor recording test
        timeout-minutes: 5
        env:
          JDBC_URL: jdbc:postgresql://localhost:5432/stavebni_denik
          DB_USER: denik
          DB_PASSWORD: denik_dev
        run: |
          set -o pipefail
          APP_JAR="$PWD/backend/build/libs/backend-all.jar" bash scripts/audit/anchor-test.sh 2>&1 | tee /tmp/audit-anchor-test.log

      - name: E2E summary
        if: ${{ !cancelled() }}
        run: |
          {
            if [ -f /tmp/gradle-assemble.log ]; then
              echo "## Backend pre-build (gradle assemble)"
              echo '```'
              grep -nE "^e: |FAILED|What went wrong|Could not|Caused by" /tmp/gradle-assemble.log | head -40 || true
              echo '```'
              echo "### Gradle assemble tail"; echo '```'; tail -n 40 /tmp/gradle-assemble.log; echo '```'
            fi
            echo "## Playwright"
            echo '```'
            grep -nE "✘|✓|passed|failed|flaky|Error:|Timeout|expect\(|at .*spec\.ts" /tmp/playwright.log | head -150 || true
            echo '```'
            echo "### Playwright tail"; echo '```'; tail -n 60 /tmp/playwright.log 2>/dev/null; echo '```'
            echo "## Backend log (errors)"
            echo '```'
            grep -nE "ERROR|WARN|Exception|Caused by" /tmp/backend.log | head -80 || true
            echo '```'
            echo "### Backend log tail"; echo '```'; tail -n 60 /tmp/backend.log 2>/dev/null; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
            /tmp/backend.log
            /tmp/playwright.log
            /tmp/gradle-assemble.log
            /tmp/restore-drill.log
            /tmp/audit-anchor-test.log
          retention-days: 14

  docker:
    name: Docker image build (Fly)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Route Docker Hub pulls through a mirror
        uses: ./.github/actions/docker-mirror

      # The image build uses the committed jOOQ sources and needs no JDK or
      # database on the runner.
      - name: Build image (no push)
        run: |
          set -o pipefail
          docker build --progress=plain -t stavebni-denik:ci . 2>&1 | tee /tmp/docker.log

      - name: Smoke test image contents
        run: |
          docker run --rm --entrypoint typst stavebni-denik:ci --version
          docker run --rm --entrypoint sh stavebni-denik:ci -c 'test -f /app/app.jar && test -f /app/static/index.html && echo "jar + SPA present"'

      # Boots the image in production mode against a throwaway PostgreSQL 18.
      # This is what catches a fat jar that cannot start (e.g. Flyway's
      # META-INF/services entries lost when the jar is assembled).
      - name: Boot image against PostgreSQL 18
        run: |
          set -euo pipefail
          DB_PASSWORD="$(openssl rand -hex 16)"       # the owner of the database (migrates)
          APP_DB_PASSWORD="$(openssl rand -hex 16)"   # the role the application runs as (data access only)
          JWT_SECRET="$(openssl rand -base64 32)"

          cleanup() {
            status=$?
            if [ "$status" -ne 0 ]; then
              echo "=== smoke test failed; app log tail ==="
              docker logs --tail 80 smoke-app 2>&1 || true
            fi
            docker rm -f smoke-app smoke-pg >/dev/null 2>&1 || true
            docker network rm smoke-net >/dev/null 2>&1 || true
            docker volume rm smoke-data >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker network create smoke-net >/dev/null
          docker run -d --name smoke-pg --network smoke-net \
            -e POSTGRES_DB=stavebni_denik -e POSTGRES_USER=denik -e POSTGRES_PASSWORD="$DB_PASSWORD" \
            postgres:18-alpine >/dev/null
          # Over TCP (-h 127.0.0.1), not the socket: while the image initialises, a temporary server answers on the socket
          # only and then restarts, so a socket check can pass just before the database goes away for a moment.
          for i in $(seq 1 30); do
            docker exec smoke-pg pg_isready -h 127.0.0.1 -U denik -d stavebni_denik >/dev/null 2>&1 && break
            sleep 1
          done
          docker exec smoke-pg pg_isready -h 127.0.0.1 -U denik -d stavebni_denik

          # The application's own database role: it owns nothing (decision D5).
          docker exec -i smoke-pg psql -U denik -d stavebni_denik -v ON_ERROR_STOP=1 -v app_password="$APP_DB_PASSWORD" \
            < scripts/sql/bootstrap-app-role.sql >/dev/null
          echo "application role created"

          # An unreleased build must refuse to start in production mode unless the
          # operator opts in explicitly (the guard runs before the database is used).
          if docker run --rm -e APP_ENV=production -e JWT_SECRET="$JWT_SECRET" \
              stavebni-denik:ci > /tmp/release-guard.log 2>&1; then
            echo "::error::the image started in production mode without ALLOW_UNRELEASED_BUILD"
            exit 1
          fi
          grep -q 'ALLOW_UNRELEASED_BUILD' /tmp/release-guard.log
          echo "release guard refuses an unreleased production start"

          # In production the application does not migrate: on a database nobody has migrated it refuses to start.
          if docker run --rm --network smoke-net -e APP_ENV=production -e ALLOW_UNRELEASED_BUILD=true -e JWT_SECRET="$JWT_SECRET" \
              -e JDBC_URL=jdbc:postgresql://smoke-pg:5432/stavebni_denik -e DB_USER=app -e DB_PASSWORD="$APP_DB_PASSWORD" \
              stavebni-denik:ci > /tmp/stale-schema.log 2>&1; then
            echo "::error::the image started in production mode on a schema that was never migrated"
            exit 1
          fi
          grep -q 'out of date' /tmp/stale-schema.log
          echo "an unmigrated schema stops the application"

          # The owner migrates and gives the application's role data access, from outside the application's machine.
          docker run --rm --network smoke-net -e APP_ENV=production \
            -e JDBC_URL=jdbc:postgresql://smoke-pg:5432/stavebni_denik \
            -e DB_MIGRATE_USER=denik -e DB_MIGRATE_PASSWORD="$DB_PASSWORD" -e DB_APP_ROLE=app \
            stavebni-denik:ci java -cp /app/app.jar cz.stavebni.denik.cli.AdminCliKt migrate | tee /tmp/migrate.log
          grep -q 'migrated' /tmp/migrate.log

          # /data is a fresh volume, owned by root like a Fly volume is: the entrypoint has to hand it to the app user.
          # The application runs as the database role that owns nothing.
          docker volume create smoke-data >/dev/null
          docker run -d --name smoke-app --network smoke-net -p 8080:8080 -v smoke-data:/data \
            -e APP_ENV=production -e ALLOW_UNRELEASED_BUILD=true -e JWT_SECRET="$JWT_SECRET" \
            -e JDBC_URL=jdbc:postgresql://smoke-pg:5432/stavebni_denik \
            -e DB_USER=app -e DB_PASSWORD="$APP_DB_PASSWORD" \
            stavebni-denik:ci >/dev/null

          for i in $(seq 1 60); do
            curl -fsS --max-time 2 http://localhost:8080/api/health 2>/dev/null | grep -q ok && break
            sleep 1
          done
          curl -fsS --max-time 2 http://localhost:8080/api/health | grep -q ok
          echo "health ok"

          # The application must not run as root, and must own its photo directory.
          uid="$(docker exec smoke-app awk '/^Uid:/ {print $2}' /proc/1/status)"
          echo "application process uid: $uid"
          [ "$uid" != "0" ]
          docker exec smoke-app sh -c 'tr "\0" " " < /proc/1/cmdline' | grep -q java
          owner="$(docker exec smoke-app stat -c %U /data/uploads)"
          echo "owner of /data/uploads: $owner"
          [ "$owner" = "app" ]

          # It really connects as that role, and that role cannot change the structure or switch a guard off.
          connected="$(docker exec smoke-pg psql -U denik -d stavebni_denik -tAc "select count(*) from pg_stat_activity where usename = 'app'")"
          echo "connections of the application's role: $connected"
          [ "$connected" -ge 1 ]
          as_app() { docker exec -e PGPASSWORD="$APP_DB_PASSWORD" smoke-pg psql -h localhost -U app -d stavebni_denik -v ON_ERROR_STOP=1 -c "$1" >/dev/null 2>&1; }
          for statement in 'create table intruder (a int)' 'alter table audit_log disable trigger all' \
              'alter table daily_reports disable trigger daily_reports_locked_immutable' 'truncate audit_log' 'delete from audit_log'; do
            if as_app "$statement"; then
              echo "::error::the application's database role was able to: $statement"
              exit 1
            fi
          done
          as_app 'select count(*) from users'
          echo "the application's role has data access and nothing else"

          # Every Flyway migration in the repo must have been applied.
          expected="$(ls backend/src/main/resources/db/migration/V*.sql | wc -l)"
          applied="$(docker exec smoke-pg psql -U denik -d stavebni_denik -tAc 'select count(*) from flyway_schema_history where success')"
          echo "migrations applied: $applied / $expected"
          [ "$applied" -eq "$expected" ]

          # Authentication is enforced and the SPA is served with security headers.
          code="$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/projects)"
          echo "GET /api/projects without a session -> $code"
          [ "$code" = "401" ]

          curl -fsS -D /tmp/smoke-headers.txt -o /tmp/smoke-index.html http://localhost:8080/
          grep -qi '^content-security-policy:' /tmp/smoke-headers.txt
          grep -qi '^x-frame-options: DENY' /tmp/smoke-headers.txt
          grep -q '<div id="root">' /tmp/smoke-index.html
          echo "SPA served with security headers"

      - name: Failure summary
        if: failure()
        run: |
          {
            echo "## docker job failure (build log below; the boot test prints the app log in its own step)"
            echo '```'
            grep -nE "ERROR|error:|failed" /tmp/docker.log | head -60 || true
            echo '```'
            echo "### tail"; echo '```'; tail -n 60 /tmp/docker.log; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  e2e-image:
    name: E2E tests against the built image (production mode)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Route Docker Hub pulls through a mirror
        uses: ./.github/actions/docker-mirror

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Setup pnpm
        run: npm install -g pnpm@${{ env.PNPM_VERSION }}

      - name: Install root dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build image (no push)
        run: |
          set -o pipefail
          docker build --progress=plain -t stavebni-denik:e2e . 2>&1 | tee /tmp/docker-e2e.log

      # The same suite as the e2e job, but against what is deployed: the image in production mode, as the database
      # role that owns nothing, with the schema migrated by the owner (scripts/ci/e2e-image.sh).
      - name: Run Playwright against the image
        timeout-minutes: 12
        env:
          IMAGE: stavebni-denik:e2e
        run: |
          set -o pipefail
          bash scripts/ci/e2e-image.sh 2>&1 | tee /tmp/playwright-image.log

      - name: Summary
        if: ${{ !cancelled() }}
        run: |
          {
            echo "## Playwright against the image"
            echo '```'
            grep -nE "✘|✓|passed|failed|flaky|Error:|Timeout|expect\(|at .*spec\.ts" /tmp/playwright-image.log | head -100 || true
            echo '```'
            echo "### Application log (errors)"; echo '```'
            grep -nE "ERROR|WARN|Exception|Caused by" /tmp/e2e-image-app.log | head -60 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report-image
          path: |
            playwright-report/
            test-results/
            /tmp/e2e-image-app.log
            /tmp/playwright-image.log
          retention-days: 14
