name: Install typst (pinned)
description: >
  Installs the typst release that renders the PDF exports, verified by SHA-256. The same version and
  checksum are pinned in the Dockerfile; change them together. The checksum matches the GitHub release
  asset digest and was verified against an independent download.

runs:
  using: composite
  steps:
    - name: Download, verify and install typst
      shell: bash
      run: |
        set -euo pipefail
        TYPST_VERSION=0.15.1
        TYPST_SHA256=a6d077d0a95eed5a2eba715b2dae06be954f624ccbf85758a03f389ded33118c
        archive=typst-x86_64-unknown-linux-musl.tar.xz
        curl -fsSL -o "$RUNNER_TEMP/$archive" "https://github.com/typst/typst/releases/download/v${TYPST_VERSION}/$archive"
        echo "${TYPST_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
        tar -xf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
        mkdir -p "$HOME/.local/bin"
        mv "$RUNNER_TEMP/typst-x86_64-unknown-linux-musl/typst" "$HOME/.local/bin/typst"
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        "$HOME/.local/bin/typst" --version
