version: 2
updates:
  # The React SPA (frontend/, its own pnpm workspace) — weekly. This is what ships.
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Europe/Prague"
    open-pull-requests-limit: 5
    versioning-strategy: increase
    labels:
      - "dependencies"
    groups:
      react:
        patterns:
          - "react"
          - "react-dom"
          - "react-router-dom"
          - "@types/react"
          - "@types/react-dom"
      build-tools:
        patterns:
          - "vite"
          - "@vitejs/*"
          - "typescript"
          - "oxlint"
      styling:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
          - "postcss"
          - "autoprefixer"
    ignore:
      # Node typings follow the runtime of the image (node:22), not the newest major.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # The Ktor backend (Gradle: root build and the backend/ module, plus the Gradle wrapper) — weekly.
  # Versions kept in plain `val xVersion = "..."` lines of a Kotlin build script may not be seen by Dependabot;
  # moving them into a version catalog would make every one of them visible.
  - package-ecosystem: "gradle"
    directories:
      - "/"
      - "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Europe/Prague"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "backend"
    groups:
      ktor:
        patterns:
          - "io.ktor:*"
      jooq:
        patterns:
          - "org.jooq:*"
      testcontainers:
        patterns:
          - "org.testcontainers:*"

  # The legacy Next.js tree at the repository root (to be removed) — updates are switched off (limit 0);
  # the entry stays so that security alerts can still be raised against it.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Europe/Prague"
    open-pull-requests-limit: 0
    versioning-strategy: increase
    labels:
      - "dependencies"
    groups:
      # Group ecosystem updates so we don't get 30 PRs for a single
      # React minor bump.
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      next:
        patterns:
          - "next"
          - "@next/*"
          - "eslint-config-next"
      prisma:
        patterns:
          - "prisma"
          - "@prisma/*"
      types:
        patterns:
          - "@types/*"
      eslint:
        patterns:
          - "eslint"
          - "eslint-*"
          - "@eslint/*"
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
      playwright:
        patterns:
          - "playwright"
          - "@playwright/*"
    ignore:
      # Pin Node typings to ambient runtime (node-20+ compatible) — major
      # bumps tend to break Prisma's runtime type imports.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # GitHub Actions — weekly.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "ci"

  # Docker base images (Dockerfile) — weekly.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "docker"
