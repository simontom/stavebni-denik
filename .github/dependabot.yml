version: 2
updates:
  # Minor and patch updates only, one pull request per ecosystem per week: a major version of a framework, a Gradle,
  # Kotlin or JDK image is a decision (and a migration), not a Monday-morning pull request. Majors are updated by hand.

  # The React SPA (frontend/, its own pnpm workspace). This is what ships.
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Europe/Prague"
    open-pull-requests-limit: 2
    versioning-strategy: increase
    labels:
      - "dependencies"
    groups:
      frontend:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # The Ktor backend. Dependabot reads the whole Gradle build from the root (it follows settings.gradle.kts into
  # backend/); naming backend/ as well made every update arrive twice. Versions kept in plain `val xVersion = "..."`
  # lines of a Kotlin build script may not be seen by Dependabot; a version catalog would make every one of them visible.
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Europe/Prague"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "backend"
    groups:
      backend:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # The repository root: the Playwright suite and the commit hooks.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Europe/Prague"
    open-pull-requests-limit: 1
    versioning-strategy: increase
    labels:
      - "dependencies"
    groups:
      tooling:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # GitHub Actions: one pull request for all of them (a new major of an action is the normal way it updates).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 1
    labels:
      - "dependencies"
      - "ci"
    groups:
      actions:
        patterns:
          - "*"

  # Docker base images (Dockerfile). The Dockerfile pins node, Gradle and the JRE by major version on purpose (JDK 21 is
  # the supported runtime and the Kotlin build targets it), so only updates inside that major are wanted.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 1
    labels:
      - "dependencies"
      - "docker"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
