version: 2
updates:
  # Minor and patch updates only, one pull request per ecosystem per week: a major version of a framework, a Gradle,
  # Kotlin or JDK image is a decision (and a migration), not a Monday-morning pull request. Majors are updated by hand.

  # The React SPA (frontend/, its own pnpm workspace). This is what ships.
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Europe/Prague"
    open-pull-requests-limit: 2
    versioning-strategy: increase
    labels:
      - "dependencies"
    groups:
      frontend:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # The Ktor backend. Dependabot reads the whole Gradle build from the root (it follows settings.gradle.kts into
  # backend/); naming backend/ as well made every update arrive twice. Versions kept in plain `val xVersion = "..."`
  # lines of a Kotlin build script may not be seen by Dependabot; a version catalog would make every one of them visible.
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Europe/Prague"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "backend"
    groups:
      backend:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # The legacy Next.js tree at the repository root (to be removed) — updates are switched off (limit 0);
  # the entry stays so that security alerts can still be raised against it.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Europe/Prague"
    open-pull-requests-limit: 0
    versioning-strategy: increase
    labels:
      - "dependencies"
    groups:
      # Group ecosystem updates so we don't get 30 PRs for a single
      # React minor bump.
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      next:
        patterns:
          - "next"
          - "@next/*"
          - "eslint-config-next"
      prisma:
        patterns:
          - "prisma"
          - "@prisma/*"
      types:
        patterns:
          - "@types/*"
      eslint:
        patterns:
          - "eslint"
          - "eslint-*"
          - "@eslint/*"
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
      playwright:
        patterns:
          - "playwright"
          - "@playwright/*"
    ignore:
      # Pin Node typings to ambient runtime (node-20+ compatible) — major
      # bumps tend to break Prisma's runtime type imports.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # GitHub Actions: one pull request for all of them (a new major of an action is the normal way it updates).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 1
    labels:
      - "dependencies"
      - "ci"
    groups:
      actions:
        patterns:
          - "*"

  # Docker base images (Dockerfile). The Dockerfile pins node, Gradle and the JRE by major version on purpose (JDK 21 is
  # the supported runtime and the Kotlin build targets it), so only updates inside that major are wanted.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 1
    labels:
      - "dependencies"
      - "docker"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
