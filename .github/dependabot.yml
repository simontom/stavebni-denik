version: 2
updates:
  # NPM dependencies (pnpm-managed) — weekly.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Europe/Prague"
    open-pull-requests-limit: 5
    versioning-strategy: increase
    labels:
      - "dependencies"
    groups:
      # Group ecosystem updates so we don't get 30 PRs for a single
      # React minor bump.
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      next:
        patterns:
          - "next"
          - "@next/*"
          - "eslint-config-next"
      prisma:
        patterns:
          - "prisma"
          - "@prisma/*"
      types:
        patterns:
          - "@types/*"
      eslint:
        patterns:
          - "eslint"
          - "eslint-*"
          - "@eslint/*"
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
      playwright:
        patterns:
          - "playwright"
          - "@playwright/*"
    ignore:
      # Pin Node typings to ambient runtime (node-20+ compatible) — major
      # bumps tend to break Prisma's runtime type imports.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # GitHub Actions — monthly.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "ci"

  # Docker base images (Dockerfile) — monthly.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "docker"
